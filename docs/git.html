<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Branch Workflow - Long-lived Docs Branch</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #4a5568;
        }
        .legend-circle {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid;
        }
        .legend-line {
            width: 30px;
            height: 3px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Git Workflow: Long-lived Docs Branch</h1>
        <div class="subtitle">Continuous documentation updates with feature development</div>
        
        <svg viewBox="0 0 1100 700" xmlns="http://www.w3.org/2000/svg">
            <!-- Define markers for arrows -->
            <defs>
                <marker id="arrowhead-main" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#2563eb" />
                </marker>
                <marker id="arrowhead-docs" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#059669" />
                </marker>
                <marker id="arrowhead-feature" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#dc2626" />
                </marker>
                <marker id="arrowhead-merge" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                    <polygon points="0 0, 10 3, 0 6" fill="#7c3aed" />
                </marker>
            </defs>

            <!-- Main branch line -->
            <line x1="50" y1="100" x2="1050" y2="100" stroke="#2563eb" stroke-width="4" />
            
            <!-- Docs branch line -->
            <line x1="50" y1="300" x2="1050" y2="300" stroke="#059669" stroke-width="4" />
            
            <!-- Feature branches -->
            <line x1="250" y1="500" x2="450" y2="500" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,5" />
            <line x1="650" y1="500" x2="850" y2="500" stroke="#dc2626" stroke-width="3" stroke-dasharray="5,5" />

            <!-- Main branch commits -->
            <circle cx="50" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="250" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="450" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="550" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="650" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="850" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="950" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>
            <circle cx="1050" cy="100" r="12" fill="#2563eb" stroke="white" stroke-width="2"/>

            <!-- Docs branch commits -->
            <circle cx="150" cy="300" r="12" fill="#059669" stroke="white" stroke-width="2"/>
            <circle cx="350" cy="300" r="12" fill="#059669" stroke="white" stroke-width="2"/>
            <circle cx="550" cy="300" r="12" fill="#059669" stroke="white" stroke-width="2"/>
            <circle cx="750" cy="300" r="12" fill="#059669" stroke="white" stroke-width="2"/>
            <circle cx="950" cy="300" r="12" fill="#059669" stroke="white" stroke-width="2"/>

            <!-- Feature branch commits -->
            <circle cx="250" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>
            <circle cx="350" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>
            <circle cx="450" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>
            
            <circle cx="650" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>
            <circle cx="750" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>
            <circle cx="850" cy="500" r="10" fill="#dc2626" stroke="white" stroke-width="2"/>

            <!-- Branch creation arrows -->
            <path d="M 50 100 L 150 300" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)" stroke-dasharray="3,3"/>
            <path d="M 250 100 L 250 500" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)" stroke-dasharray="3,3"/>
            <path d="M 650 100 L 650 500" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)" stroke-dasharray="3,3"/>

            <!-- Merge arrows: docs → main -->
            <path d="M 350 300 L 450 100" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowhead-merge)"/>
            <path d="M 750 300 L 850 100" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowhead-merge)"/>

            <!-- Merge arrows: main → docs (sync) -->
            <path d="M 450 100 L 550 300" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)" stroke-dasharray="5,3"/>
            <path d="M 850 100 L 950 300" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)" stroke-dasharray="5,3"/>

            <!-- Merge arrows: feature → main -->
            <path d="M 450 500 L 450 100" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowhead-merge)"/>
            <path d="M 850 500 L 850 100" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrowhead-merge)"/>

            <!-- Labels -->
            <text x="50" y="80" font-size="16" font-weight="bold" fill="#2563eb" text-anchor="middle">main</text>
            <text x="150" y="280" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">docs</text>
            <text x="250" y="480" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">feature-A</text>
            <text x="750" y="480" font-size="14" font-weight="bold" fill="#dc2626" text-anchor="middle">feature-B</text>

            <!-- Annotations -->
            <text x="150" y="340" font-size="12" fill="#4a5568" text-anchor="middle">Create docs</text>
            <text x="150" y="355" font-size="12" fill="#4a5568" text-anchor="middle">branch</text>

            <text x="350" y="240" font-size="12" fill="#4a5568" text-anchor="middle">Update docs</text>

            <text x="400" y="190" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Merge docs→main</text>
            <text x="400" y="205" font-size="11" fill="#7c3aed" text-anchor="middle">(keep branch open)</text>

            <text x="510" y="230" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Sync main→docs</text>

            <text x="750" y="240" font-size="12" fill="#4a5568" text-anchor="middle">Update docs</text>

            <text x="450" y="410" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Merge feature→main</text>

            <text x="800" y="190" font-size="13" font-weight="600" fill="#7c3aed" text-anchor="middle">Merge docs→main</text>
            <text x="800" y="205" font-size="11" fill="#7c3aed" text-anchor="middle">(repeat cycle)</text>

            <text x="910" y="230" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">Sync main→docs</text>

            <!-- Time arrow -->
            <path d="M 70 620 L 1030 620" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrowhead-merge)"/>
            <text x="550" y="655" font-size="14" fill="#64748b" text-anchor="middle" font-style="italic">Time →</text>

            <!-- Step numbers -->
            <circle cx="150" cy="300" r="18" fill="white" stroke="#059669" stroke-width="2"/>
            <text x="150" cy="306" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">1</text>

            <circle cx="350" cy="300" r="18" fill="white" stroke="#059669" stroke-width="2"/>
            <text x="350" cy="306" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">2</text>

            <circle cx="450" cy="100" r="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
            <text x="450" cy="106" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">3</text>

            <circle cx="550" cy="300" r="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
            <text x="550" cy="306" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">4</text>

            <circle cx="750" cy="300" r="18" fill="white" stroke="#059669" stroke-width="2"/>
            <text x="750" cy="306" font-size="14" font-weight="bold" fill="#059669" text-anchor="middle">5</text>

            <circle cx="850" cy="100" r="18" fill="white" stroke="#7c3aed" stroke-width="2"/>
            <text x="850" cy="106" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">6</text>
        </svg>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-circle" style="background: #2563eb; border-color: #2563eb;"></div>
                <span><strong>main</strong> branch</span>
            </div>
            <div class="legend-item">
                <div class="legend-circle" style="background: #059669; border-color: #059669;"></div>
                <span><strong>docs</strong> branch (long-lived)</span>
            </div>
            <div class="legend-item">
                <div class="legend-circle" style="background: #dc2626; border-color: #dc2626;"></div>
                <span><strong>feature</strong> branches (temporary)</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: #7c3aed;"></div>
                <span>Merge (solid) / Sync (dashed)</span>
            </div>
        </div>
    </div>
</body>
</html>
